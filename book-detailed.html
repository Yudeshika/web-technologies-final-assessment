<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <title>Sanke - Reading Corner</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark sticky-top">
      <div class="container-fluid">
        <a
          class="navbar-brand d-flex align-items-center gap-2"
          href="index.html"
        >
          <img
            src="images/sanke-logo.png"
            alt="Sanke Logo"
            style="width: 40px"
            class="rounded-pill"
          />
          <span class="fw-bold">SANKE</span>
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#collapsibleNavbar"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="collapsibleNavbar">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="about.html">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="reading-corner.html">Reading Corner</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="contact.html">Get in Touch</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container mt-4">
      <a
        href="reading-corner.html"
        class="text-muted small text-decoration-none"
        >&larr; Back to search results</a
      >
    </div>

    <!-- book details section -->
    <section class="py-5">
      <div class="container">
        <div class="row g-5">
          <!-- book cover -->
          <div class="col-md-3 text-center">
            <img
              src=""
              alt=""
              id="book-cover"
              class="img-fluid rounded shadow"
            />
          </div>

          <!-- book details -->
          <div class="col-md-9">
            <p class="text-uppercase text-muted small fw-semibold">
              Book Details
            </p>
            <h1 id="book-title" class="fw-bold"></h1>
            <p id="book-author" class="lead"></p>
            <p id="book-year" class="text-muted small"></p>
            <div id="book-genres" class="mb-4"></div>
            <p id="book-description"></p>
            <div class="d-flex gap-3 mt-4">
              <button id="save-btn" class="btn btn-outline-light">
                Save to Reading List
              </button>
              <a
                href="#"
                id="open-library-link"
                target="_blank"
                class="btn btn-outline-secondary"
                >View on Open Library</a
              >
            </div>
          </div>
        </div>
      </div>
    </section>

    <hr class="my-0 border-secondary" />

    <!-- about book section -->
    <section class="py-5">
      <div class="container">
        <div class="row g-5">
          <div class="col-md-6">
            <h3 class="fw-bold mb-4">About this book</h3>
            <p id="about-book" class="text-muted"></p>
          </div>
          <div class="col-md-6">
            <h3 class="fw-bold mb-4">About Author</h3>
            <div class="d-flex gap-3">
              <img
                src=""
                alt=""
                id="author-photo"
                class="rounded"
                style="width: 80px; height: 80px; object-fit: cover"
              />
              <div>
                <h5 id="author-name"></h5>
                <p id="author-bio" class="text-muted small"></p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- footer -->
    <footer class="py-4 bg-dark text-light text-center">
      <p class="mb-1 fw-bold">Thank you for visiting!</p>
      <p class="mb-0 text-muted small">
        Designed with HTML, Bootstrap 5 & JavaScript
      </p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/book-detailed.js"></script>
  </body>
</html>
