<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <title>Sanke - Reading Corner</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark sticky-top">
      <div class="container-fluid">
        <a
          class="navbar-brand d-flex align-items-center gap-2"
          href="index.html"
        >
          <img
            src="images/sanke-logo.png"
            alt="Sanke Logo"
            style="width: 40px"
            class="rounded-pill"
          />
          <span class="fw-bold">SANKE</span>
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#collapsibleNavbar"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="collapsibleNavbar">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="about.html">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="reading-corner.html">Reading Corner</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="contact.html">Get in Touch</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- hero section -->
     <section class="py-5">
        <div class="container">
            <p class="text-uppercase text-muted fw-semibold">Discover your next read</p>
            <h1 class="display-5 fw-bold">A world of books. One place to explore.</h1>
            <p class="lead">Search by title or author and find your next good book.</p>

            <form id="search-form" class="mt-4">

                <div class="row g-2">
                    <div class="col-md-4 col-sm-6">
                        <label for="search-input">Search books</label>
                        <input type="search" class="form-control" name="search-input" id="search-input" placeholder="Search Books....">
                    </div>
                    <div class="col-md-4 col-sm-6">
                      <div>
                        <label for="genre-filter">Genre Filter</label>
                        <select id="genre-filter" class="form-select">
                          <option value="">All Genres</option>
                          <option value="fiction">Fiction</option>
                          <option value="fantacy">Fantacy</option>
                          <option value="science_fiction">Science Fiction</option>
                          <option value="mystery">Mystery</option>
                          <option value="biography">Biography</option>
                          <option value="children">Children</option>
                          <option value="romance">Romance</option>
                          <option value="horror">Horror</option>
                        </select>
                      </div>
                    </div>
                    <div class="col-md-2">

                    </div>
                    <div class="col-md-2">
                        <label for="sort-by">Sort by</label>
                        <select class="form-select" name="sort-by" id="sort-by">
                          <option value="">Relevance</option>
                          <option value="new">Newest</option>
                          <option value="old">Oldest</option>
                          <option value="rating">Highest Rating</option>
                          <option value="readinglog">Most Popular</option>
                          <option value="title">Title A-Z</option>
                        </select>
                    </div>
                    <div class="col-md-10 col-sm-12">
                        <label class="form-label">Year: <span id="year-filter-label">2000</span></span></label>
                        <div class="year-wrapper">
                          <input type="range" id="year-filter" min="1900" max="2026" value="2000" list="year-ticks"/>
                          <datalist id="year-ticks">
                            <option value="1900"></option>
                            <option value="1925"></option>
                            <option value="1950"></option>
                            <option value="1975"></option>
                            <option value="2000"></option>
                            <option value="2025"></option>
                          </datalist>
                          <div class="year-labels">
                            <span>1900</span>
                            <span>1925</span>
                            <span>1950</span>
                            <span>1975</span>
                            <span>2000</span>
                            <span>2025</span>
                          </div>
                        </div>
                    </div>
                    <div class="col-md-2">
                        <label for="search-input"></label>
                        <button type="submit" class="btn btn-outline-light w-100">Search</button>
                    </div>
                </div>
            </form>
        </div>
     </section>

     <!-- search results -->
      <section class="py-5">
        <div class="container">
            <p id="results-count" class="text-muted small mb-4 d-none"></p>
            <div id="results-grid" class="row g-4"></div>

            <div id="pagination" class="d-flex justify-content-center align-items-center gap-3 mt-5 d-none">
                <button id="prev-btn" class="btn btn-outline-secondary">&#8592; Prev</button>
                <span id="page-info" class="text-muted small"></span>
                <button id="next-btn" class="btn btn-outline-light">Next &#8594;</button>
            </div>
        </div>
      </section>

    <!-- footer -->
    <footer class="py-4 bg-dark text-light text-center ">
      <p class="mb-1 fw-bold">Thank you for visiting!</p>
      <p class="mb-0 text-muted small">
        Designed with HTML, Bootstrap 5 & JavaScript
      </p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/reading-corner.js"></script>
  </body>
</html>
